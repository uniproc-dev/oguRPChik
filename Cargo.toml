[package]
name = "ogurpchik"
version = "0.6.2"
edition = "2024"
authors = ["ignatternyev54@gmail.com"]
license = "MIT"
description = "Host <-> VM-agent and host <-> plugin RPC over vsock/uds/npipe, with capnp-rpc on top of a compio transport."
keywords = ["rpc", "windows", "linux", "ipc"]

[dependencies]
compio = { version = "0.18.0", features = ["net", "process", "macros", "time", "fs"] }
socket2 = "0.6.2"

error-stack = "0.8"
capnp = "0.27"
capnp-rpc = "0.27"

# Handshake (auth/handshake): binrw packet bodies, HMAC proof, OS randomness.
binrw = "0.15.0"
hmac = "0.12.1"
sha2 = "0.10.9"
getrandom = "0.4.2"

# Signed-process attestation (auth/signed_process): ed25519 image signatures.
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["std"] }
base64 = "0.22.1"

futures = "0.3.32"
tracing = { version = "0.1.44", features = ["release_max_level_warn"] }

# vsock (net/vsock): VM GUID resolution via vmcompute.dll (JSON output).
uuid = { version = "1.20.0", features = ["v4", "serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"

[features]
fuzzing = []

[dev-dependencies]
testschema = { path = "tests/testschema" }
proptest = "1.11"
compio = { version = "0.18.0", features = ["io-compat"] }

[target.'cfg(windows)'.dependencies]
windows = { git = "https://github.com/microsoft/windows-rs", rev = "c14074c45", features = [
    "minwindef", "winnt", "winbase", "handleapi", "processthreadsapi",
    "securitybaseapi", "sddl", "aclapi", "accctrl",
    "winsock2", "ws2", "mswsock"] }

# net/vsock/utils.rs loads vmcompute.dll dynamically and falls back to a
# registry lookup for the WSL VM id — pre-`windows`-crate idioms kept from
# the original (proven) code.
winreg = "0.55.0"
widestring = "1.2.1"
winapi = { version = "0.3.9", features = ["libloaderapi", "combaseapi", "minwindef", "ntdef"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "1.1", features = ["net", "time"] }

[target.'cfg(unix)'.dependencies]
libc = "1.0.0-alpha.2"

[profile.release]
split-debuginfo = "packed"
lto = "thin"
codegen-units = 1
